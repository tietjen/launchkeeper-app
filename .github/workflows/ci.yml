name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-26
    steps:
      # The newest Xcode on the image — the app is developed with a current Swift.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        # On failure, a verbose rebuild shows the frontend/linker invocations.
        run: swift build
      - name: Test (AppCore + HelperCore — no helper, no window)
        run: swift test
      - name: Localization complete (every string has an English translation)
        run: Scripts/localize.sh --check
      - name: App bundle (unsigned, universal)
        run: Scripts/build-app.sh --universal --no-sign
