name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-26
    steps:
      # The newest Xcode on the image: Swift 6.1 (Xcode 16.4, the default)
      # compiled the app module without writing object files (live 2026-09-26);
      # the app is developed with Swift 6.4.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test (AppCore + HelperCore — no helper, no window)
        run: swift test
      - name: App bundle (unsigned, universal)
        run: Scripts/build-app.sh --universal --no-sign
